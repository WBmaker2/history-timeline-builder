<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=1440">
<title>cork</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;background:#8a6a3f;color:#2b1d0e;font-family:Georgia,serif}
.topbar{height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#6b4f2a;border-bottom:3px solid #4a3518;box-shadow:0 2px 0 #3a2812}
.btn{background:#f4e6c8;border:1px solid #4a3518;color:#2b1d0e;padding:6px 12px;border-radius:3px;font-size:13px;font-family:inherit;box-shadow:1px 1px 0 #3a2812}
.btn.primary{background:#c94a2a;color:#fff;border-color:#8a2a14}
.title{font-size:16px;font-weight:700;margin-right:12px;color:#f4e6c8;font-family:'Trebuchet MS',sans-serif}
.body{display:grid;grid-template-columns:240px 1fr 280px;height:852px}
.pane{background:#7a5a30;padding:14px;border-right:3px solid #4a3518;overflow:hidden;position:relative}
.props{border-right:none;border-left:3px solid #4a3518}
.pane::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(0,0,0,.15),transparent 50%);pointer-events:none}
.pane h3{font-size:13px;margin-bottom:10px;color:#f4e6c8;font-family:'Trebuchet MS',sans-serif}
.stack{display:flex;flex-direction:column;gap:8px}
.cardidx{background:#f4e6c8;border:2px solid #4a3518;padding:8px 10px;border-radius:2px;box-shadow:2px 2px 0 #3a2812;position:relative}
.cardidx .pin{position:absolute;top:-6px;left:10px;width:10px;height:10px;border-radius:50%;background:#c94a2a;border:2px solid #8a2a14}
.cardidx .t{font-size:13px;font-weight:700}
.cardidx .d{font-size:11px;color:#6b4f2a}
.canvas{position:relative;background:#8a6a3f;overflow:hidden}
.canvas::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 15% 25%,rgba(0,0,0,.18),transparent 45%),radial-gradient(circle at 75% 65%,rgba(0,0,0,.12),transparent 50%),repeating-radial-gradient(circle at 50% 50%,rgba(0,0,0,.05) 0 1px,transparent 1px 6px)}
.pinned{position:absolute;width:150px;background:#f4e6c8;border:2px solid #4a3518;padding:8px;border-radius:2px;box-shadow:3px 3px 0 rgba(0,0,0,.3);transform:rotate(-1.5deg)}
.pinned .color{height:5px;margin-bottom:6px}
.pinned .t{font-weight:700;font-size:13px}
.pinned .d{font-size:11px;color:#6b4f2a}
.pinned.sel{outline:3px solid #c94a2a;transform:rotate(0deg)}
.string{position:absolute;pointer-events:none}
.note{background:#fff8dc;border:1px solid #c9a86a;padding:12px;border-radius:2px;font-size:12px;box-shadow:2px 2px 0 rgba(0,0,0,.2)}
.note h4{font-size:12px;margin-bottom:6px;color:#6b4f2a}
.note input,.note textarea{width:100%;border:1px solid #c9a86a;background:#fff;padding:5px;border-radius:2px;font-size:12px;margin-bottom:6px;font-family:inherit}
</style></head><body>
<div class="topbar">
  <span class="title">히스토리 타임라인 빌더</span>
  <button class="btn">← 홈</button>
  <input class="btn" value="조선 후기" style="background:#f4e6c8;min-width:180px">
  <select class="btn"><option>조선</option></select>
  <button class="btn">인과관계 연결</button>
  <button class="btn primary">+ 사건</button>
  <button class="btn">내보내기</button>
  <button class="btn">비교</button>
</div>
<div class="body">
  <aside class="pane">
    <h3>사건 목록</h3>
    <div class="stack">
      <div class="cardidx"><span class="pin"></span><div class="t">임진왜란</div><div class="d">1592 · #e8c87a</div></div>
      <div class="cardidx"><span class="pin"></span><div class="t">선조 피난</div><div class="d">1593 · #7aa8e8</div></div>
      <div class="cardidx"><span class="pin"></span><div class="t">이순신 거북선</div><div class="d">1592 · #e87a9a</div></div>
    </div>
  </aside>
  <main class="canvas">
    <svg style="position:absolute;inset:0;pointer-events:none" width="920" height="852">
      <path d="M205,150 C260,210 300,210 315,270" fill="none" stroke="#c94a2a" stroke-width="3" stroke-linecap="round"/>
      <circle cx="205" cy="150" r="5" fill="#c94a2a"/>
      <circle cx="315" cy="270" r="5" fill="#c94a2a"/>
      <path d="M380,150 C420,200 500,200 520,150" fill="none" stroke="#2a6a8a" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="pinned" style="left:130px;top:90px"><div class="color" style="background:#e8c87a"></div><div class="t">임진왜란</div><div class="d">1592-04-13</div></div>
    <div class="pinned sel" style="left:240px;top:210px"><div class="color" style="background:#7aa8e8"></div><div class="t">선조 피난</div><div class="d">1593-01-25</div></div>
    <div class="pinned" style="left:450px;top:90px;transform:rotate(1.2deg)"><div class="color" style="background:#e87a9a"></div><div class="t">이순신 거북선</div><div class="d">1592-07-08</div></div>
  </main>
  <aside class="props pane props">
    <h3>속성</h3>
    <div class="note">
      <h4>제목</h4><input value="선조 피난">
      <h4>날짜</h4><input value="1593-01-25">
      <h4>설명</h4><textarea rows="3">왕이 의주로 피난...</textarea>
    </div>
  </aside>
</div>
</body></html>
